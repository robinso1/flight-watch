name: tp-watch
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    paths:
      - tp_watch.py
permissions:
  contents: write
concurrency:
  group: tp-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt requests
      - run: python tp_watch.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name "flight-watch"
          git config user.email "flight-watch@users.noreply.github.com"
          git add data/tp_state.json
          git diff --cached --quiet && exit 0
          git commit -m "tp state"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
